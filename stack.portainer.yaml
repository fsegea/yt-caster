# Stack para Portainer.
# Uso: en Portainer -> Stacks -> Add stack, pega este contenido (o sube el archivo).
services:
  app:
    image: fsegea/yt-caster:v1.1.0
    container_name: yt-caster
    restart: unless-stopped
    network_mode: host
    environment:
      - CHROMECAST_IP=${CHROMECAST_IP:-10.10.0.44}
    volumes:
      - yt_descargas:/descargas
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud')"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  yt_descargas: