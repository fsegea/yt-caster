name: Build and publish image

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  # Los tests corren en las dos versiones de Python que soporta el proyecto,
  # incluida la del contenedor. Sin esto se publicaba una imagen de 3.12
  # probada solo con el interprete del puesto de desarrollo.
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # VERSION (etiqueta de la imagen) y pyproject.toml (requires-python/version)
      # no pueden divergir: si no cuadran, se aborta antes de publicar nada.
      - name: Comprobar coherencia de version
        run: |
          set -eu
          desde_fichero=$(cat VERSION)
          desde_pyproject="v$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$desde_fichero" != "$desde_pyproject" ]; then
            echo "::error::VERSION dice $desde_fichero y pyproject.toml dice $desde_pyproject"
            exit 1
          fi
          echo "version: $desde_fichero"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # La etiqueta de la imagen sale del fichero VERSION del commit,
      # asi que imagen y codigo no pueden divergir.
      - name: Determinar etiqueta
        id: ver
        run: echo "tag=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: |
            fsegea/yt-caster:${{ steps.ver.outputs.tag }}
            fsegea/yt-caster:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
