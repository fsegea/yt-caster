# Producción: imagen sin montajes, sin reload, usuario no-root, healthcheck.
# Uso: podman-compose -f compose.prod.yaml up -d --build
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: yt-caster:prod
    container_name: yt-caster
    restart: unless-stopped
    network_mode: host
    environment:
      - CHROMECAST_IP=${CHROMECAST_IP:-10.10.0.44}
    volumes:
      - yt_descargas:/descargas
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud')"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  yt_descargas: