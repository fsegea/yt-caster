# Unica fuente declarativa de la version de Python del proyecto.
# Debe cuadrar con: Dockerfile.dev, Dockerfile.prod, .python-version y la matriz
# de tests del CI. El CI comprueba ademas que `version` cuadra con el fichero VERSION.
[project]
name = "yt-caster"
version = "1.3.2"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
