# Unica fuente declarativa de la version de Python del proyecto.
# Debe cuadrar con: Dockerfile.dev, Dockerfile.prod, .python-version y la matriz
# de tests del CI. El CI comprueba ademas que `version` cuadra con el fichero VERSION.
[project]
name = "yt-caster"
version = "1.4.0"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest` a secas (el script de consola, como lo invoca el CI) no pone el raiz del
# repo en sys.path, y `from app...` en los tests revienta con ModuleNotFoundError.
# `python -m pytest` si lo pone (anade el CWD), por eso en local pasaba.
pythonpath = ["."]
